server:
  port: 8080

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/water_data?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    root: INFO
    com.clarimire: DEBUG
    org.springframework.web: INFO

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.clarimire.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# JWT配置
jwt:
  secret: ${JWT_SECRET:ClarimireAquaGuardian-2026-SecureJWTSecretKey-xK9mP2vL8nQ5wZ7jR3tY6uI0oA}
  expiration: 86400000 # 24小时

# Knife4j配置
knife4j:
  enable: true
  setting:
    language: zh_cn
